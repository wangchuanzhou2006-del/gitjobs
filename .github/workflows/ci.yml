name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  lint-and-test-server:
    runs-on:
      labels: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1
          components: clippy, rustfmt
      - name: Install Tailwind CSS
        run: |
          wget -O /usr/local/bin/tailwindcss https://github.com/tailwindlabs/tailwindcss/releases/download/v4.0.17/tailwindcss-linux-x64
          chmod +x /usr/local/bin/tailwindcss
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- --deny warnings
      - name: Run rustfmt
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test

  lint-templates:
    runs-on:
      labels: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Install djlint
        run: pip install djlint==1.36.4
      - name: Run djlint
        run: |
          djlint \
            --reformat \
            --configuration gitjobs-server/templates/.djlintrc \
            gitjobs-server/templates

  check-js-files-format:
    runs-on:
      labels: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Run prettier
        uses: creyD/prettier_action@v4.6
        with:
          dry: true
          prettier_options: --check gitjobs-server/static/js/**/*.js --config gitjobs-server/static/js/.prettierrc.yaml

  test-database:
    runs-on:
      labels: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Build database test images
        run: |
          docker build --tag gitjobs-db-tests:ci --file database/tests/Dockerfile-db-tests .
          docker build --tag gitjobs-postgres-db-tests:ci --file database/tests/Dockerfile-postgres-db-tests .
      - name: Start test database
        run: |
          docker network create gitjobs-db-tests
          docker run \
            --detach \
            --name gitjobs-postgres-db-tests \
            --network gitjobs-db-tests \
            --network-alias postgres \
            --env POSTGRES_DB=tests \
            --env POSTGRES_PASSWORD=tests \
            --env POSTGRES_USER=tests \
            gitjobs-postgres-db-tests:ci
      - name: Wait for test database
        run: |
          for attempt in $(seq 1 60); do
            if docker run --rm --network gitjobs-db-tests gitjobs-db-tests:ci pg_isready -h postgres -U tests -d tests; then
              exit 0
            fi
            sleep 1
          done
          echo "PostgreSQL did not become ready in time" >&2
          exit 1
      - name: Apply database migrations
        run: |
          docker run --rm \
            --network gitjobs-db-tests \
            --volume "${{ github.workspace }}:/workspace" \
            --workdir /workspace/database/migrations \
            --env TERN_CONF=/workspace/.github/workflows/tern.conf \
            gitjobs-db-tests:ci \
            sh ./migrate.sh
      - name: Verify reversible talent key-version migration
        run: |
          docker run --rm \
            --network gitjobs-db-tests \
            --volume "${{ github.workspace }}:/workspace" \
            --workdir /workspace/database/tests \
            --env PGHOST=postgres \
            --env PGPORT=5432 \
            --env PGDATABASE=tests \
            --env PGUSER=tests \
            --env PGPASSWORD=tests \
            gitjobs-db-tests:ci \
            sh migrations/0018_talent_key_versions_u32.sh
      - name: Install pgtap database extension
        run: |
          docker run --rm \
            --network gitjobs-db-tests \
            --env PGPASSWORD=tests \
            gitjobs-db-tests:ci \
            psql -h postgres -p 5432 -U tests tests -c 'create extension pgtap;'
      - name: Run database tests
        run: |
          docker run --rm \
            --network gitjobs-db-tests \
            --volume "${{ github.workspace }}:/workspace" \
            --workdir /workspace/database/tests \
            --env PGPASSWORD=tests \
            gitjobs-db-tests:ci \
            sh -c 'pg_prove --host postgres --dbname tests --username tests --verbose schema/*.sql functions/*/*.sql'
      - name: Run tender two-session database checks
        run: |
          docker run --rm \
            --network gitjobs-db-tests \
            --volume "${{ github.workspace }}:/workspace" \
            --workdir /workspace/database/tests \
            --env PGHOST=postgres \
            --env PGPORT=5432 \
            --env PGDATABASE=tests \
            --env PGUSER=tests \
            --env PGPASSWORD=tests \
            --env TENDER_CONCURRENCY_TEST=1 \
            gitjobs-db-tests:ci \
            sh functions/tender/tender_concurrency.sh
      - name: Show database logs
        if: failure()
        run: docker logs gitjobs-postgres-db-tests
      - name: Clean up database containers
        if: always()
        run: |
          docker rm --force gitjobs-postgres-db-tests || true
          docker network rm gitjobs-db-tests || true
