{% extends "dashboard/dashboard_base_moderator.html" -%}

{% block document_language %}zh-CN{% endblock document_language %}
{% block page_title %}编辑关注 | GitJobs{% endblock page_title %}

{% block dashboard_main -%}
<div id="dashboard-content" class="mx-auto w-full max-w-3xl px-4 py-5 sm:px-6 sm:py-8">
  <header class="border-b border-stone-200 pb-5">
    <a class="inline-flex min-h-11 items-center text-sm font-semibold text-primary-700" href="/dashboard/moderator/talent/radar">返回信息雷达</a>
    <h1 class="m-0 mt-2 text-2xl font-semibold text-stone-950">编辑关注</h1>
  </header>
  <form method="post" action="/dashboard/moderator/talent/radar/{{ subscription_id }}/edit" class="mt-6 space-y-5">
    <input type="hidden" name="subscription_id" value="{{ subscription_id }}">
    <div><span class="form-label">来源名称</span><p class="mb-0 mt-2 min-h-11 py-2 text-stone-900">{{ source_name }}</p><input type="hidden" name="source_name" value="{{ source_name }}"></div>
    <label class="block"><span class="form-label">从哪里找</span><input class="input-primary mt-2 min-h-11" name="public_url" type="url" required value="{{ public_url }}"></label>
    <label class="block"><span class="form-label">找什么</span><input class="input-primary mt-2 min-h-11" name="keywords" required maxlength="500" value="{{ keywords }}"></label>
    <label class="block"><span class="form-label">多久找一次</span><select class="input-primary mt-2 min-h-11" name="frequency"><option value="daily" {% if frequency == "daily" %}selected{% endif %}>每天一次</option><option value="twice_daily" {% if frequency == "twice_daily" %}selected{% endif %}>每天两次</option><option value="weekly" {% if frequency == "weekly" %}selected{% endif %}>每周一次</option></select></label>
    <label class="flex min-h-11 items-center gap-3"><input type="checkbox" name="enabled" value="true" {% if enabled %}checked{% endif %}><span class="font-medium text-stone-800">继续关注</span></label>
    <div class="sticky bottom-0 -mx-4 border-t border-stone-200 bg-white/95 px-4 py-3 backdrop-blur sm:static sm:mx-0 sm:flex sm:justify-end sm:border-0 sm:bg-transparent sm:p-0"><button class="btn-primary min-h-11 w-full justify-center sm:w-auto" type="submit">保存修改</button></div>
  </form>
</div>
{% endblock dashboard_main -%}
