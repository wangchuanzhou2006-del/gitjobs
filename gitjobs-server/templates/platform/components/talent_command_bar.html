<section class="talent-command-bar" aria-labelledby="talent-command-title">
  <p>人才匹配工作台</p>
  <h1 id="talent-command-title">说明条件，查看餐饮人才与岗位</h1>
  <div role="group" aria-label="人才模式">
    <button type="button" data-talent-mode="hiring" aria-pressed="true">我要招人</button>
    <button type="button" data-talent-mode="seeking" aria-pressed="false">我要求职</button>
  </div>
  <label for="talent-command-input">匹配条件</label>
  <input id="talent-command-input"
         type="text"
         placeholder="例如：北京、炒锅、可住宿">
</section>
