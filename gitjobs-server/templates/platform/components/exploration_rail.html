<aside class="opportunity-rail opportunity-surface"
       data-testid="desktop-exploration-rail"
       aria-label="主要探索">
  <a class="opportunity-brand opportunity-focus"
     href="/opportunities"
     aria-label="餐饮情报机会首页">餐饮
    <br>
  情报</a>
  <nav aria-label="桌面主导航">
    <a class="opportunity-focus"
       href="/opportunities"{% if page_id == PageId::Opportunities %} aria-current="page"{% endif %}>机会</a>
    <a class="opportunity-focus" href="/talent"
       title="现有招聘与求职"{% if page_id == PageId::Talent %} aria-current="page"{% endif %}>人才</a>
    <span aria-disabled="true" title="后续阶段开放">情报</span>
    <span aria-disabled="true" title="后续阶段开放">企业</span>
  </nav>
  <button id="opportunity-theme-toggle"
          class="opportunity-focus"
          type="button"
          aria-label="切换深色沉浸模式">明暗</button>
</aside>

<nav class="opportunity-mobile-nav opportunity-surface"
     data-testid="mobile-opportunity-nav"
     aria-label="移动主导航">
  <a class="opportunity-focus"
     href="/opportunities"{% if page_id == PageId::Opportunities %} aria-current="page"{% endif %}>机会</a>
  <a class="opportunity-focus"
     href="/talent"{% if page_id == PageId::Talent %} aria-current="page"{% endif %}>人才</a>
  <a class="opportunity-focus" href="#ai-command-input">AI</a>
  <span aria-disabled="true">消息</span>
  <span aria-disabled="true">我的</span>
</nav>
