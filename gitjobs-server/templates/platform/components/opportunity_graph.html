<section class="opportunity-visual opportunity-surface" aria-labelledby="opportunity-visual-title">
  <div class="opportunity-visual-heading">
    <div>
      <p class="opportunity-eyebrow">机会星图</p>
      <h2 id="opportunity-visual-title">从区域密度进入具体项目</h2>
    </div>
    <p role="note">界面原型数据，不代表真实项目</p>
  </div>
  <ul class="opportunity-legend" aria-label="星图视觉含义">
    <li>颜色表示项目类型</li>
    <li>光环表示可信度</li>
    <li>脉冲表示截止紧迫度</li>
  </ul>
  <div
    id="opportunity-graph"
    role="img"
    aria-label="餐饮项目机会星图；可使用下方列表访问相同项目"
  ></div>
</section>
